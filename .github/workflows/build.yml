name: Build FreedomVPN APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "FreedomVPN-next.zip"

      - name: Extract project
        run: |
          unzip -q FreedomVPN-next.zip -d source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/FreedomVPN" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreedomVPN-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
